[project]
name = "mind-palace-train"
version = "0.1.0"
description = "Agent Palace Gym: River AI datasets, SFT specialists, palace RL env, eval scoreboard"
requires-python = ">=3.12"
# Dry-run paths (trajectories, eval --dry-run, rl --dry-run) are stdlib-only.
dependencies = []

[project.optional-dependencies]
# Real River jobs: `uv sync --project server/train --extra river` (pulls transformers for tokenizers).
river = ["river-client>=0.12.0"]

[tool.uv]
package = false
